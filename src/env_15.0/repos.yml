##############################################################################
## Odoo Repository
##############################################################################

./src/odoo:
    defaults:
        depth: 1
    remotes:
        odoo: https://github.com/odoo/odoo
    target: odoo 15.0-target
    merges:
        - odoo 15.0

##############################################################################
## OpenUpgrade Repository
##############################################################################

./src/openupgrade:
    defaults:
        depth: 300
    remotes:
        OCA: https://github.com/OCA/OpenUpgrade
        trobz: git@github.com:trobz/OpenUpgrade.git
    target: trobz merge-branch-foodcoop-15.0
    merges:
        - trobz 15.0
        - trobz refs/pull/5/head

